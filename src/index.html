<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a2342"><meta name="color-scheme" content="dark">
<title>Juega EnCicla</title>
<meta name="description" content="Juega EnCicla: videojuego arcade offline sobre el sistema de bicicletas públicas del Valle de Aburrá. Del usuario al supervisor: 11 oficios del sistema, mundo libre y multijugador.">
<meta name="application-name" content="Juega EnCicla"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EnCicla"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!--HEAD-->
<style>/*FONTS*//*CSS*/</style>
</head><body><noscript>Juega EnCicla necesita JavaScript activado.</noscript>
<div id="app">
 <section id="sCover" class="scr on">
  <div class="cbody">
   <h1 class="mega">Juega</h1>
   <h1 class="mega g b2">EnCicla</h1>
   <canvas id="coverArt" width="200" height="125" aria-label="Ciclista pedaleando por la ciclorruta al atardecer en el Valle de Aburrá"></canvas>
   <div class="cbtns">
    <button class="btn pri" id="bPlay">▶ Jugar</button>
    <button class="btn amb" id="bReto">★ Reto del día</button>
    <div class="row" style="justify-content:center"><button class="btn sm" id="bHow">Cómo jugar</button><button class="btn sm" id="bShare">Compartir</button></div>
   </div>
  </div>
  <div class="cfoot"><span>Creado por OneZero</span><span id="ver">v</span></div>
 </section>

 <section id="sHome" class="scr">
  <header class="mast"><div class="brand">Juega<b>EnCicla</b></div><div class="chips"><span class="chip">NIV <b id="hLvl">1</b></span><span class="chip">★ <b id="hStars">0</b></span></div><button class="ib" id="bHomeCover" aria-label="Portada">⌂</button></header>
  <nav id="tabs"><button data-tab="ruta" class="on">Escalafón</button><button data-tab="album">Álbum</button><button data-tab="parts">Partidas</button><button data-tab="mas">Más</button></nav>
  <div class="scroll"><div class="wrap">
   <div id="tab-ruta" class="tab on"></div>
   <div id="tab-album" class="tab"></div>
   <div id="tab-parts" class="tab"></div>
   <div id="tab-mas" class="tab"></div>
  </div></div>
 </section>

 <section id="sBrief" class="scr"><div class="scroll"><div class="wrap" id="briefBody"></div></div></section>

 <section id="sGame" class="scr">
  <canvas id="cv"></canvas>
  <div id="hud"><button id="bPause" aria-label="Pausa">❚❚</button><span class="ttl" id="hudTtl"></span><span class="chip" id="hudClock"></span><span class="chip" id="hudScore"></span><span id="hudChips" class="row" style="gap:6px"></span></div>
  <div id="goalsMini"></div>
  <div id="coach"></div>
  <div id="actBar"></div>
 </section>

 <section id="sResult" class="scr"><div class="scroll"><div class="wrap" id="resBody"></div></div></section>
 <div id="toast"></div>
 <div id="modal" hidden><div class="mbox" id="mBody"></div></div>
 <input type="file" id="fileIn" accept=".json,application/json" hidden>
</div>
<script>/*JS*/</script>
</body></html>
